<svg width="560" height="160" viewBox="0 0 560 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GemFetch logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a9cff"/>
      <stop offset="1" stop-color="#2149c4"/>
    </linearGradient>
    <clipPath id="cardClip"><rect width="560" height="160" rx="24"/></clipPath>
    <clipPath id="gemClip"><polygon points="80,26 128,80 80,134 32,80"/></clipPath>
  </defs>

  <rect width="560" height="160" rx="24" fill="url(#bg)"/>

  <g clip-path="url(#cardClip)">
    <!-- drifting soft sparkle dust in the background -->
    <circle cx="480" cy="40" r="2.2" fill="#ffffff" opacity="0">
      <animate attributeName="opacity" values="0;.8;0" dur="2.6s" begin="0.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="510" cy="90" r="1.6" fill="#ffffff" opacity="0">
      <animate attributeName="opacity" values="0;.7;0" dur="2.2s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="440" cy="120" r="1.8" fill="#ffffff" opacity="0">
      <animate attributeName="opacity" values="0;.6;0" dur="3s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- the gem: bounces, with a little squash-and-stretch for personality -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -14; 0 0; 0 -3; 0 0" keyTimes="0;0.35;0.6;0.8;1" dur="1.9s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="scale" values="1 1; 1.06 0.92; 1 1; 0.97 1.04; 1 1" keyTimes="0;0.35;0.6;0.8;1" dur="1.9s" repeatCount="indefinite" additive="sum"/>
      <polygon points="80,26 128,80 80,134 32,80" fill="#ffffff"/>
      <polygon points="80,26 128,80 80,134" fill="#cfe0ff"/>
      <polygon points="80,26 32,80 80,134" fill="#ffffff"/>
      <!-- shine sweep across the gem face -->
      <g clip-path="url(#gemClip)">
        <rect x="-40" y="0" width="26" height="160" fill="#ffffff" opacity="0" transform="skewX(-18)">
          <animate attributeName="x" values="0;170" dur="2.6s" begin="0.4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;.55;0" dur="2.6s" begin="0.4s" repeatCount="indefinite"/>
        </rect>
      </g>
      <!-- a tiny wink: the gem's "eye" facet blinks, because why not -->
      <ellipse cx="80" cy="72" rx="5" ry="6" fill="#2149c4" opacity="0.85">
        <animate attributeName="ry" values="6;6;0.6;6;6" keyTimes="0;0.85;0.9;0.95;1" dur="3.4s" repeatCount="indefinite"/>
      </ellipse>
    </g>
  </g>

  <!-- twinkles popping around the gem -->
  <text x="128" y="38" font-size="20" fill="#ffffff" opacity="0">✦
    <animate attributeName="opacity" values="0;1;0" dur="1.9s" begin="0.1s" repeatCount="indefinite"/>
  </text>
  <text x="18" y="120" font-size="14" fill="#ffffff" opacity="0">✦
    <animate attributeName="opacity" values="0;1;0" dur="1.9s" begin="1s" repeatCount="indefinite"/>
  </text>
  <text x="132" y="128" font-size="12" fill="#ffffff" opacity="0">✧
    <animate attributeName="opacity" values="0;1;0" dur="1.9s" begin="1.5s" repeatCount="indefinite"/>
  </text>

  <!-- wordmark -->
  <text x="170" y="98" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="46" font-weight="800" fill="#ffffff">GemFetch</text>
  <text x="172" y="124" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="15" fill="#e6edff">one click: AI chat to tidy Markdown</text>
</svg>
