<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 13px/1.5 system-ui, sans-serif; width: 400px; margin: 0; padding: 14px; }
    h1 { font-size: 14px; margin: 0 0 6px; }
    label { font-weight: 600; display: block; margin: 8px 0 3px; }
    input[type=text], textarea { width: 100%; padding: 6px; box-sizing: border-box; font-family: inherit; }
    textarea { resize: vertical; }
    button { padding: 7px 12px; cursor: pointer; font-size: 13px; }
    #save { width: 100%; margin-top: 10px; }
    #stop, #restart { margin: 6px 0; }
    #log { margin: 8px 0; white-space: pre-wrap; color: #333; }
    .err { color: #b3261e; }
    .ok { color: #187d3c; }
    .warn { color: #9a6700; }
    a { color: #1a73e8; }
    #editor { display: none; }
    .recent { margin-top: 12px; border-top: 1px solid #e0e0e0; padding-top: 8px; }
    .recent h2 { font-size: 12px; color: #666; margin: 0 0 6px; }
    .row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
    .row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row select, .row button { font-size: 11px; padding: 2px 4px; }
  </style>
</head>
<body>
  <h1>GemFetch</h1>
  <div id="log">Reading page…</div>
  <button id="stop" style="display:none">■ Stop analysis</button>
  <button id="restart" style="display:none">↻ Start again</button>

  <div id="editor">
    <label for="title">Title</label>
    <input id="title" type="text" />

    <label for="synth">Synthesis</label>
    <textarea id="synth" rows="6"></textarea>

    <label for="group" id="groupLabel" style="display:none">Group (tab-group subfolder)</label>
    <input id="group" type="text" style="display:none" />

    <button id="save">Save</button>
  </div>

  <div class="recent" id="recentWrap" style="display:none">
    <h2>Recent</h2>
    <div id="recent"></div>
  </div>

  <div style="margin-top:8px"><a href="#" id="opts">Settings</a></div>

  <script src="shared.js"></script>
  <script src="scrape.js"></script>
  <script src="popup.js"></script>
</body>
</html>
