<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 13px/1.5 system-ui, sans-serif; width: 340px; margin: 0; padding: 14px; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    label { font-weight: 600; display: block; margin-bottom: 3px; }
    input[type=text] { width: 100%; padding: 6px; box-sizing: border-box; margin-bottom: 8px; }
    button { padding: 7px 12px; cursor: pointer; font-size: 13px; }
    #go { width: 100%; }
    #log { margin: 10px 0; white-space: pre-wrap; color: #333; min-height: 34px; }
    .err { color: #b3261e; }
    .ok { color: #187d3c; }
    a { color: #1a73e8; }
    .recent { margin-top: 10px; border-top: 1px solid #e0e0e0; padding-top: 8px; }
    .recent h2 { font-size: 12px; color: #666; margin: 0 0 6px; }
    .row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
    .row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row select, .row button { font-size: 11px; padding: 2px 4px; }
  </style>
</head>
<body>
  <h1>GemFetch</h1>
  <label for="group">Group (Chrome tab group → subfolder)</label>
  <input id="group" type="text" placeholder="Inbox" />
  <button id="go">Fetch &amp; save this page</button>
  <div id="log">Detecting…</div>
  <div class="recent" id="recentWrap" style="display:none">
    <h2>Recent — move to another group</h2>
    <div id="recent"></div>
  </div>
  <div style="margin-top:8px"><a href="#" id="opts">Settings</a></div>

  <script src="shared.js"></script>
  <script src="scrape.js"></script>
  <script src="popup.js"></script>
</body>
</html>
